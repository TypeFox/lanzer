name: Docs

on:
  push:
    branches: [main]
    paths: ['docs/**', 'packages/lanzer/syntaxes/**', 'package.json', 'package-lock.json', '.github/workflows/docs.yml']
  pull_request:
    paths: ['docs/**', 'packages/lanzer/syntaxes/**', 'package.json', 'package-lock.json', '.github/workflows/docs.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The Lox grammar used for highlighting lives in the langium-lox submodule.
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.2
          cache: npm
      - run: npm ci
      # Fails on dead links between pages.
      - run: npm run docs:build
      - uses: actions/upload-artifact@v4
        with:
          name: docs
          path: docs/.vitepress/dist
