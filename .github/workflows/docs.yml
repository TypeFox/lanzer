name: Docs

on:
  push:
    branches: [main]
    paths: ['docs/**', 'packages/lanzer/syntaxes/**', 'package.json', 'package-lock.json', '.github/workflows/docs.yml']
  pull_request:
    paths: ['docs/**', 'packages/lanzer/syntaxes/**', 'package.json', 'package-lock.json', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push does not cancel one already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The Lox grammar used for highlighting lives in the langium-lox submodule.
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.2
          cache: npm
      - run: npm ci
      # Fails on dead links between pages.
      - run: npm run docs:build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  # Publishes to GitHub Pages from main only; pull requests stop after the build.
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
